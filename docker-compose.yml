networks:
  n8n_network:
    driver: bridge

volumes:
  n8n_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./n8n_data
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./postgres_data
  qdrant_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./qdrant_data
  shared:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./shared

services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: n8n_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"      # solo loopback — accede via SSH tunnel
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - n8n_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    # Puerto 5678 solo interno — nginx maneja el acceso externo
    expose:
      - "5678"
    environment:
      # Base
      N8N_HOST: solvex.site
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://solvex.site:5678/

      # Base de datos
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

      # Seguridad
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # Ejecuciones
      EXECUTIONS_MODE: ${EXECUTIONS_MODE:-regular}
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: true

      # Timezone
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Bogota}
      TZ: ${GENERIC_TIMEZONE:-America/Bogota}

      # LLM (descomentar según el proveedor que uses)
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

      # Logs
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}

    volumes:
      - n8n_data:/home/node/.n8n
      - shared:/data/shared
    networks:
      - n8n_network
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: n8n_nginx
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_FILE_HOST}:/etc/nginx/certs/fullchain.pem:ro
      - ${SSL_KEY_FILE_HOST}:/etc/nginx/certs/privkey.pem:ro
    networks:
      - n8n_network
    depends_on:
      - n8n
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
